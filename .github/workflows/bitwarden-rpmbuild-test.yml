# Build + install-test: rewrap upstream RPM with Fedora spec
name: bitwarden Fedora RPM build + install test
on: workflow_dispatch
env:
  REPO_DEV: bitwarden
  REPO_NAME: clients
  # bitwarden/clients is a monorepo: desktop releases are tagged
  # desktop-vX.Y.Z, so the latest-release endpoint cannot be used —
  # filter by prefix.
  TAG_PREFIX: desktop-v
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      # fedora:45 ships no git, so actions/checkout would silently fall back to
      # downloading a source tarball and leave no .git behind.
      - name: Install git
        run: sudo dnf install -y -q git
      - name: Checkout local
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository }}
      # Steps run as root inside the container while the bind-mounted workspace
      # is owned by the runner user (uid 1001), so git rejects the repository as
      # dubiously owned. actions/checkout only records safe.directory in a
      # temporary global config that it reverts.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: sudo dnf install -y -q git gawk jq curl python3 rpm-build rpmdevtools cpio desktop-file-utils appstream rpmlint
      - name: Get latest desktop version
        id: step_version
        run: |
          latest_release_tag=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO_DEV/$REPO_NAME/releases?per_page=100" | jq -r '[.[] | select(.tag_name | startswith(env.TAG_PREFIX)) | select(.draft != true and .prerelease != true)] | sort_by(.published_at) | last | .tag_name // empty')
          if [ -z "$latest_release_tag" ]; then echo "ERROR: tag empty"; exit 1; fi
          version_no_v=$(echo "$latest_release_tag" | sed "s/^$TAG_PREFIX//")
          echo "VERSION_NO_V=$version_no_v" >> "$GITHUB_OUTPUT"
      - name: Patch spec and metainfo version
        run: |
          version_no_v="${{ steps.step_version.outputs.VERSION_NO_V }}"
          sed -i "s/^Version:.*/Version:        ${version_no_v}/" specs/bitwarden.spec
          # Keep the top changelog entry coherent with the patched Version so
          # rpmlint's incoherent-version-in-changelog check stays clean.
          sed -i -E "0,/^(\* .* - )[0-9][0-9.]*-[0-9]+$/s//\1${version_no_v}-1/" specs/bitwarden.spec
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"|<release version=\"${version_no_v}\" date=\"$(date +%F)\"|" sources/com.bitwarden.desktop.metainfo.xml
          head -12 specs/bitwarden.spec
      - name: Validate curated AppStream metadata
        run: |
          appstreamcli validate --no-net sources/com.bitwarden.desktop.metainfo.xml
      - name: Build RPM locally
        run: |
          set -o pipefail
          rpmdev-setuptree
          VERSION_NO_V="${{ steps.step_version.outputs.VERSION_NO_V }}"
          # spectool fetches the upstream RPM (Source0) and the GPL license
          # text for the exact release tag (Source1). No fallback: a failed
          # fetch fails the build.
          cp sources/com.bitwarden.desktop.metainfo.xml $HOME/rpmbuild/SOURCES/
          cp specs/bitwarden.spec $HOME/rpmbuild/SPECS/
          cd $HOME/rpmbuild/SPECS
          spectool -g -R bitwarden.spec
          # Integrity check: the downloaded RPM must match the sha512
          # published for that asset in the upstream release's
          # latest-linux.yml. Same-origin integrity only: upstream publishes
          # no detached checksums or signatures for the RPM.
          RPM_PATH=$(ls "$HOME"/rpmbuild/SOURCES/Bitwarden-*-x86_64.rpm | head -1)
          RPM_FILE=${RPM_PATH##*/}
          UPSTREAM_YML=$(curl -fsSL "https://github.com/$REPO_DEV/$REPO_NAME/releases/download/desktop-v${{ steps.step_version.outputs.VERSION_NO_V }}/latest-linux.yml")
          EXPECTED_B64=$(printf '%s\n' "$UPSTREAM_YML" | python3 -c "
          import sys
          want = sys.argv[1]
          url = None
          for line in sys.stdin:
              s = line.strip()
              if s.startswith('-'):
                  s = s[1:].strip()
              if s.startswith('url:'):
                  url = s.split(':', 1)[1].strip()
              elif s.startswith('sha512:') and url == want:
                  print(s.split(':', 1)[1].strip())
                  break
          " "$RPM_FILE")
          if [ -z "$EXPECTED_B64" ]; then
            echo "ERROR: no sha512 for $RPM_FILE in upstream latest-linux.yml"
            exit 1
          fi
          ACTUAL_B64=$(python3 -c "import hashlib,base64,sys; print(base64.b64encode(hashlib.sha512(open(sys.argv[1],'rb').read()).digest()).decode())" "$RPM_PATH")
          if [ "$EXPECTED_B64" != "$ACTUAL_B64" ]; then
            echo "ERROR: checksum mismatch for $RPM_FILE"
            echo "upstream: $EXPECTED_B64"
            echo "actual:   $ACTUAL_B64"
            exit 1
          fi
          echo "Checksum OK for $RPM_FILE"
          rpmbuild -ba bitwarden.spec 2>&1 | tail -15
          ls -lh $HOME/rpmbuild/RPMS/x86_64/
      - name: Verify the blob is byte-identical to the upstream RPM
        run: |
          # The spec's contract is that /opt/Bitwarden ships exactly as upstream
          # published it. Fedora's default brp hooks (brp-strip,
          # brp-strip-comment-note, …) rewrite any ELF they see, so a silent
          # macro change would otherwise only show up as a different binary.
          upstream=$(ls $HOME/rpmbuild/SOURCES/Bitwarden-*-x86_64.rpm | head -1)
          built=$(ls $HOME/rpmbuild/RPMS/x86_64/bitwarden-*.rpm | grep -v debug | head -1)
          rm -rf /tmp/payload-upstream /tmp/payload-built
          mkdir -p /tmp/payload-upstream /tmp/payload-built
          (cd /tmp/payload-upstream && rpm2cpio "$upstream" | cpio -idm --quiet)
          (cd /tmp/payload-built && rpm2cpio "$built" | cpio -idm --quiet)
          # diff exits non-zero and prints the differing files if anything in
          # the bundle was rewritten.
          diff -r /tmp/payload-upstream/opt /tmp/payload-built/opt
          echo "### Blob is byte-identical to the upstream RPM :heavy_check_mark:" >> $GITHUB_STEP_SUMMARY
      - name: Inspect built RPM Requires
        run: |
          rpm_file=$(ls $HOME/rpmbuild/RPMS/x86_64/bitwarden-*.x86_64.rpm | grep -v debug | head -1)
          echo "=== Built RPM: $rpm_file ==="
          rpm -qpR "$rpm_file"
          echo "REQUIRES_OUTPUT_END"
          if rpm -qpR "$rpm_file" | grep -q 'libc\.musl'; then
            echo "ERROR: auto-generated musl requirement leaked into the package"
            exit 1
          fi
      - name: Validate packaged desktop and AppStream metadata
        run: |
          rpm_file=$(ls $HOME/rpmbuild/RPMS/x86_64/bitwarden-*.x86_64.rpm | grep -v debug | head -1)
          rm -rf /tmp/rpmbuild-check
          mkdir -p /tmp/rpmbuild-check
          cd /tmp/rpmbuild-check
          rpm2cpio "$rpm_file" | cpio -idmu --quiet
          desktop-file-validate usr/share/applications/bitwarden.desktop
          appstreamcli validate --no-net usr/share/metainfo/com.bitwarden.desktop.metainfo.xml
      - name: Run rpmlint
        run: |
          rpm_file=$(ls $HOME/rpmbuild/RPMS/x86_64/bitwarden-*.x86_64.rpm | grep -v debug | head -1)
          # rpmlintrc documents every inherent blob finding (the /opt layout,
          # $ORIGIN RPATHs, unstripped prebuilt binaries, the non-setuid
          # chrome-sandbox tripping the setgroups pattern, Chromium's legacy
          # gethostbyname call, the two upstream-declared lib deps invisible
          # to the generator, dictionary misses, no docs/man page by design,
          # symlinked binary). Anything else breaks this step.
          rpmlint -r "$GITHUB_WORKSPACE/rpmlintrc" "$rpm_file"
      - name: Install-test the rebuilt RPM
        run: |
          set -o pipefail
          rpm_file=$(ls $HOME/rpmbuild/RPMS/x86_64/bitwarden-*.x86_64.rpm | grep -v debug | head -1)
          echo "=== Installing $rpm_file (expect gtk/nss/alsa/cups libs pulled) ==="
          dnf in -y "$rpm_file" 2>&1 | tail -30
          rpm -q bitwarden
          # The post-install scriptlet may chmod chrome-sandbox to 4755 on
          # systems without user namespaces; verify everything else but
          # ignore that expected mode delta.
          rpm -V --nomode bitwarden
          mode=$(stat -c '%a' /opt/Bitwarden/chrome-sandbox)
          case "$mode" in
            755|4755) ;;
            *) echo "ERROR: unexpected chrome-sandbox mode: $mode"; exit 1 ;;
          esac
          test -L /usr/bin/bitwarden
          readlink -f /usr/bin/bitwarden | grep -qx /opt/Bitwarden/bitwarden
          echo "### Install test passed :heavy_check_mark:" >> $GITHUB_STEP_SUMMARY
