# Build + install-test: rewrap upstream RPM with Fedora spec
name: bitwarden Fedora RPM build + install test
on: workflow_dispatch
env:
  REPO_DEV: bitwarden
  REPO_NAME: clients
  # bitwarden/clients is a monorepo: desktop releases are tagged
  # desktop-vX.Y.Z, so the latest-release endpoint cannot be used —
  # filter by prefix.
  TAG_PREFIX: desktop-v
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      # fedora:44 ships no git, so actions/checkout would silently fall back to
      # downloading a source tarball and leave no .git behind.
      - name: Install git
        run: sudo dnf install -y -q git
      - name: Checkout local
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository }}
      # Steps run as root inside the container while the bind-mounted workspace
      # is owned by the runner user (uid 1001), so git rejects the repository as
      # dubiously owned. actions/checkout only records safe.directory in a
      # temporary global config that it reverts.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: sudo dnf install -y -q git gawk jq curl rpm-build rpmdevtools cpio desktop-file-utils appstream rpmlint
      - name: Get latest desktop version
        id: step_version
        run: |
          latest_release_tag=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO_DEV/$REPO_NAME/releases?per_page=100" | jq -r '[.[] | select(.tag_name | startswith(env.TAG_PREFIX)) | select(.draft != true and .prerelease != true)] | sort_by(.published_at) | last | .tag_name // empty')
          if [ -z "$latest_release_tag" ]; then echo "ERROR: tag empty"; exit 1; fi
          version_no_v=$(echo "$latest_release_tag" | sed "s/^$TAG_PREFIX//")
          echo "VERSION_NO_V=$version_no_v" >> "$GITHUB_OUTPUT"
      - name: Patch spec and metainfo version
        run: |
          sed -i "s/^Version:.*/Version:        ${{ steps.step_version.outputs.VERSION_NO_V }}/" specs/bitwarden.spec
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"|<release version=\"${{ steps.step_version.outputs.VERSION_NO_V }}\" date=\"$(date +%F)\"|" sources/com.bitwarden.desktop.metainfo.xml
          head -12 specs/bitwarden.spec
      - name: Validate curated AppStream metadata
        run: |
          appstreamcli validate --no-net sources/com.bitwarden.desktop.metainfo.xml
      - name: Build RPM locally
        run: |
          rpmdev-setuptree
          VERSION_NO_V="${{ steps.step_version.outputs.VERSION_NO_V }}"
          # spectool fetches the upstream RPM (Source0) and the GPL license
          # text for the exact release tag (Source1). No fallback: a failed
          # fetch fails the build.
          cp sources/com.bitwarden.desktop.metainfo.xml $HOME/rpmbuild/SOURCES/
          cp specs/bitwarden.spec $HOME/rpmbuild/SPECS/
          cd $HOME/rpmbuild/SPECS
          spectool -g -R bitwarden.spec
          rpmbuild -ba bitwarden.spec 2>&1 | tail -15
          ls -lh $HOME/rpmbuild/RPMS/x86_64/
      - name: Inspect built RPM Requires
        run: |
          rpm_file=$(ls $HOME/rpmbuild/RPMS/x86_64/bitwarden-*.x86_64.rpm | grep -v debug | head -1)
          echo "=== Built RPM: $rpm_file ==="
          rpm -qpR "$rpm_file"
          echo "REQUIRES_OUTPUT_END"
      - name: Validate packaged desktop and AppStream metadata
        run: |
          rpm_file=$(ls $HOME/rpmbuild/RPMS/x86_64/bitwarden-*.x86_64.rpm | grep -v debug | head -1)
          rm -rf /tmp/rpmbuild-check
          mkdir -p /tmp/rpmbuild-check
          cd /tmp/rpmbuild-check
          rpm2cpio "$rpm_file" | cpio -idmu --quiet
          desktop-file-validate usr/share/applications/bitwarden.desktop
          appstreamcli validate --no-net usr/share/metainfo/com.bitwarden.desktop.metainfo.xml
      - name: Run rpmlint
        run: |
          rpm_file=$(ls $HOME/rpmbuild/RPMS/x86_64/bitwarden-*.x86_64.rpm | grep -v debug | head -1)
          # rpmlintrc documents every inherent blob finding (the /opt layout,
          # $ORIGIN RPATHs, unstripped prebuilt binaries, the non-setuid
          # chrome-sandbox tripping the setgroups pattern, Chromium's legacy
          # gethostbyname call, the two upstream-declared lib deps invisible
          # to the generator, dictionary misses, no docs/man page by design,
          # symlinked binary). Anything else breaks this step.
          rpmlint -r "$GITHUB_WORKSPACE/rpmlintrc" "$rpm_file"
      - name: Install-test the rebuilt RPM
        run: |
          rpm_file=$(ls $HOME/rpmbuild/RPMS/x86_64/bitwarden-*.x86_64.rpm | grep -v debug | head -1)
          echo "=== Installing $rpm_file (expect gtk/nss/alsa/cups libs pulled) ==="
          dnf in -y "$rpm_file" 2>&1 | tail -30
          rpm -q bitwarden
          rpm -V bitwarden
          echo "### Install test passed :heavy_check_mark:" >> $GITHUB_STEP_SUMMARY
